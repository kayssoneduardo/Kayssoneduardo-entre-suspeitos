name: Gerar APK V7 - Teste geral
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gerar-apk-flutter-v7.yml'
      - 'v7_pending/**'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto Flutter
        run: |
          unzip -oq EntreSuspeitos_Flutter_V5.zip -d flutter_v7
          test -f flutter_v7/EntreSuspeitos_Flutter_V5/pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        working-directory: flutter_v7/EntreSuspeitos_Flutter_V5
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name entre_suspeitos --org br.com.entresuspeitos .
          python3 scripts/android_permissions.py
          if grep -q 'package:material_ui/material_ui.dart' test/widget_test.dart 2>/dev/null; then
            rm test/widget_test.dart
          fi
      - name: Incorporar pacote V7 e gerar os assets
        working-directory: flutter_v7/EntreSuspeitos_Flutter_V5
        run: |
          set -euo pipefail
          cp ../../v6_overlay/lib/offline.dart lib/offline.dart
          cp ../../v7_pending/lib/main.dart lib/main.dart
          cp ../../v7_pending/lib/auth_flow.dart lib/auth_flow.dart
          cp ../../v7_pending/lib/create_room_v7.dart lib/create_room_v7.dart
          cp ../../v7_pending/lib/social_v7.dart lib/social_v7.dart
          cp ../../v7_pending/lib/admin_v7.dart lib/admin_v7.dart
          python3 ../../v7_pending/scripts/patch_online.py
          python3 ../../v7_pending/scripts/patch_manifest.py
          cp ../../v6_overlay/scripts/generate_assets.py scripts/generate_assets.py
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 scripts/generate_assets.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          p.write_text(p.read_text().replace('version: 5.0.0+1','version: 7.0.1+2'))
          PY
      - name: Dependencias e testes
        working-directory: flutter_v7/EntreSuspeitos_Flutter_V5
        run: |
          flutter pub get
          flutter test
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Gerar APKs release por arquitetura
        working-directory: flutter_v7/EntreSuspeitos_Flutter_V5
        env:
          ES_URL: ${{ vars.SUPABASE_URL }}
          ES_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$ES_URL"
          test -n "$ES_KEY"
          flutter build apk --release --split-per-abi --tree-shake-icons --dart-define="SUPABASE_URL=$ES_URL" --dart-define="SUPABASE_ANON_KEY=$ES_KEY"
          ls -lh build/app/outputs/flutter-apk/app-*-release.apk
      - name: Disponibilizar o unico pacote consolidado
        uses: actions/upload-artifact@v4
        with:
          name: Entre-Suspeitos-V7-Teste-Geral-APK
          path: flutter_v7/EntreSuspeitos_Flutter_V5/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
