name: Verificar desenvolvimento Entre Suspeitos V7.4
on:
  push:
    branches: ['feature/v7-4-preparacao-20261114', 'feature/v7-4-1-cosmeticos-banners-20261114', 'feature/v7-4-3-banners-ilustrados-revisao', 'feature/v744-cosmeticos-cenarios-raridades-20261114', 'feature/v745-banners-cinematicos-aprovados-20261114']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          for file in web/*.js; do node --check "$file"; done
          node v7_pending/tests/web_auth_smoke.cjs
          node v7_pending/tests/word_bank_smoke.cjs
          node v7_pending/tests/v74_smoke.cjs
          node v7_pending/tests/v741_cosmetics_smoke.cjs
          node v7_pending/tests/v742_polish_smoke.cjs
          node v7_pending/tests/v743_banner_assets_smoke.cjs
          V745_REQUIRE_ASSETS=1 node v7_pending/tests/v745_banners_integrity_smoke.cjs
          node v7_pending/tests/v75_smoke.cjs
          node v7_pending/tests/v75_ui_integration_smoke.cjs
          node v7_pending/tests/v76_entrance_smoke.cjs
          node v7_pending/tests/v762_room_controls_smoke.cjs
          node v7_pending/tests/v77_integration_smoke.cjs
          node v7_pending/tests/v77_android_race_smoke.cjs
          node v7_pending/tests/v77_android_browser_smoke.cjs
          node v7_pending/tests/v78_vote_replay_smoke.cjs
          node v7_pending/tests/v79_arena_frontal_smoke.cjs
          node v7_pending/tests/v81_title_skins_smoke.cjs
      - name: Verificar arquivos e permissões da V7.4
        run: |
          test -f v7_pending/sql/v74_social_progress.sql
          test -f v7_pending/sql/v74_mission_rewards.sql
          grep -q 'branches: \[main\]' .github/workflows/publicar-site-v7.yml
          echo 'Testes de branch concluídos, sem publicação.'
