
name: Instalar banco Entre Suspeitos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar SQL
        run: |
          set -e
          test -f EntreSuspeitos_SQL_GitHub.zip
          unzip -p EntreSuspeitos_SQL_GitHub.zip instalar.sql > /tmp/instalar.sql
          test -s /tmp/instalar.sql

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Instalar banco de dados
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -e
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /tmp/instalar.sql

      - name: Verificar instalacao
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "select to_regprocedure('public.es_start(uuid)') is not null;"
          
