
name: Teste de automacao

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir conexao sem mostrar senha
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          raw = os.getenv("DB_URL", "").strip()
          try:
              u = urlsplit(raw)
              checks = {
                "Segredo configurado": bool(raw),
                "Usuario correto": (u.username or "").startswith("postgres."),
                "Servidor correto": (u.hostname or "").endswith(".pooler.supabase.com"),
                "Porta correta": u.port == 5432,
                "Senha presente": bool(u.password),
              }
          except Exception:
              checks = {"URL valida": False}

          for nome, ok in checks.items():
              print(nome, "OK" if ok else "FALHA")

          if not all(checks.values()):
              sys.exit(1)

          print("FORMATO DA CONEXAO CORRETO")
          PY

      - name: Testar acesso ao Supabase
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '15'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -w -X -At -c "SELECT 'CONEXAO_OK';"
          
