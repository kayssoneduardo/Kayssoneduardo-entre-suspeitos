name: Gerar APK Flutter V6
on:
  workflow_dispatch:
  push:
    paths:
      - 'EntreSuspeitos_Flutter_V5.zip'
      - 'v6_overlay/**'
      - '.github/workflows/gerar-apk-flutter-v5.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Extrair Flutter V5
        shell: bash
        run: |
          set -euo pipefail
          test -s EntreSuspeitos_Flutter_V5.zip || { echo "Envie EntreSuspeitos_Flutter_V5.zip para a raiz do repositorio"; exit 1; }
          unzip -oq EntreSuspeitos_Flutter_V5.zip -d flutter_v5
          test -f flutter_v5/EntreSuspeitos_Flutter_V5/pubspec.yaml
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Criar projeto Android nativo
        working-directory: flutter_v5/EntreSuspeitos_Flutter_V5
        run: |
          flutter create --platforms=android --project-name entre_suspeitos --org br.com.entresuspeitos .
          python3 scripts/android_permissions.py
          # flutter create gera um teste de exemplo incompatível com o app existente.
          # Conservamos os testes reais incluídos no pacote V5.
          if grep -q 'package:material_ui/material_ui.dart' test/widget_test.dart 2>/dev/null; then
            rm test/widget_test.dart
          fi
      - name: Aplicar melhorias V6 e gerar assets
        shell: bash
        working-directory: flutter_v5/EntreSuspeitos_Flutter_V5
        run: |
          set -euo pipefail
          cp ../../v6_overlay/lib/main.dart lib/main.dart
          cp ../../v6_overlay/lib/offline.dart lib/offline.dart
          cp ../../v6_overlay/scripts/generate_assets.py scripts/generate_assets.py
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 scripts/generate_assets.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          s=p.read_text().replace("version: 5.0.0+1","version: 6.0.0+1")
          p.write_text(s)
          PY
      - name: Dependencias
        working-directory: flutter_v5/EntreSuspeitos_Flutter_V5
        run: flutter pub get
      - name: Testes automatizados
        working-directory: flutter_v5/EntreSuspeitos_Flutter_V5
        run: |
          flutter test
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compilar APK
        working-directory: flutter_v5/EntreSuspeitos_Flutter_V5
        env:
          ES_URL: ${{ vars.SUPABASE_URL }}
          ES_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$ES_URL"
          test -n "$ES_KEY"
          flutter build apk --release --split-per-abi --tree-shake-icons --dart-define="SUPABASE_URL=$ES_URL" --dart-define="SUPABASE_ANON_KEY=$ES_KEY"
          ls -lh build/app/outputs/flutter-apk/app-*-release.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Entre-Suspeitos-V6-APK-Otimizado
          path: flutter_v5/EntreSuspeitos_Flutter_V5/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
