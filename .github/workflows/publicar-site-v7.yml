name: Publicar site Entre Suspeitos Web V7
on:
  workflow_dispatch:
  push:
    paths:
      - 'v7_pending/scripts/patch_web_v7.py'
      - 'web/**'
      - 'v7_pending/tests/**'
      - '.github/workflows/publicar-site-v7.yml'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      url: https://kayssoneduardo.github.io/Kayssoneduardo-entre-suspeitos/
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e tentar ativar o GitHub Pages gratuitamente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          HEADERS=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          CODE=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' "${HEADERS[@]}" "$API")
          if [ "$CODE" = "200" ]; then
            echo "GitHub Pages já ativado."
          elif [ "$CODE" = "404" ]; then
            echo "Tentando habilitar Pages diretamente..."
            POST=$(curl -sS -o /tmp/pages-post.json -w '%{http_code}' -X POST "${HEADERS[@]}" \
              -H "Content-Type: application/json" -d '{"build_type":"workflow"}' "$API")
            if [ "$POST" != "201" ] && [ "$POST" != "409" ]; then
              echo "Pages precisa de autorização do proprietário (HTTP $POST)."
              echo "Abrir: https://github.com/${GITHUB_REPOSITORY}/settings/pages"
              echo "Em Build and deployment > Source, escolher GitHub Actions."
              exit 1
            fi
            echo "GitHub Pages ativado!"
          else
            echo "Falha ao consultar Pages (HTTP $CODE)."
            exit 1
          fi
      - name: Utilizar arquivos web versionados
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/online.js
          test -f web/server-config.js
          echo "Publicando a mesma versão do código web revisado."
      - name: Testes automáticos do site
        run: |
          set -euo pipefail
          for f in web/*.js; do node --check "$f"; done
          node v7_pending/tests/web_auth_smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          assert 'MIN=3' in Path('web/online.js').read_text()
          assert 'joined.length>=3' in Path('web/online.js').read_text()
          assert Path('web/words.js').read_text().count('"w":')==1333
          assert 'ES_SERVER_CONFIG' in Path('web/server-config.js').read_text()
          assert 'verifyEmailLink' in Path('web/online.js').read_text()
          print('Verificações de site, multiplayer e dicionário aprovadas.')
          PY
      - name: Empacotar site para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://kayssoneduardo.github.io/Kayssoneduardo-entre-suspeitos/
    steps:
      - name: Publicar na internet
        uses: actions/deploy-pages@v4

  verificar-site-publico:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verificar site real no iPhone e computador
        run: |
          set -euo pipefail
          URL="https://kayssoneduardo.github.io/Kayssoneduardo-entre-suspeitos"
          echo "Verificando $URL"
          for i in $(seq 1 12); do
            if curl --silent --show-error --fail --location --max-time 20 \
              -D /tmp/header -o /tmp/index "$URL/" \
              && grep -qi '^content-type: *text/html' /tmp/header \
              && grep -q 'ENTRE SUSPEITOS' /tmp/index; then
              break
            fi
            sleep 5
          done
          grep -qi '^content-type: *text/html' /tmp/header
          grep -q 'ENTRE SUSPEITOS' /tmp/index
          for file in online.js app.js server-config.js words.js style.css; do
            curl --silent --show-error --fail --location --retry 3 \
              --max-time 25 "$URL/$file" -o "/tmp/$file"
          done
          node --check /tmp/online.js
          node --check /tmp/app.js
          grep -q 'MIN=3' /tmp/online.js
          test "$(grep -o '"w":' /tmp/words.js | wc -l)" -eq 1333
          echo "SITE PUBLICADO E VERIFICADO: $URL/"
