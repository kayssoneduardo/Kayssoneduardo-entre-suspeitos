name: Publicar site Entre Suspeitos Web V7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v7_pending/scripts/patch_web_v7.py'
      - 'web/**'
      - 'v7_pending/tests/**'
      - '.github/workflows/publicar-site-v7.yml'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      url: https://kayssoneduardo.github.io/Kayssoneduardo-entre-suspeitos/
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e tentar ativar o GitHub Pages gratuitamente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          HEADERS=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          CODE=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' "${HEADERS[@]}" "$API")
          if [ "$CODE" = "200" ]; then
            echo "GitHub Pages já ativado."
          elif [ "$CODE" = "404" ]; then
            echo "Tentando habilitar Pages diretamente..."
            POST=$(curl -sS -o /tmp/pages-post.json -w '%{http_code}' -X POST "${HEADERS[@]}" \
              -H "Content-Type: application/json" -d '{"build_type":"workflow"}' "$API")
            if [ "$POST" != "201" ] && [ "$POST" != "409" ]; then
              echo "Pages precisa de autorização do proprietário (HTTP $POST)."
              echo "Abrir: https://github.com/${GITHUB_REPOSITORY}/settings/pages"
              echo "Em Build and deployment > Source, escolher GitHub Actions."
              exit 1
            fi
            echo "GitHub Pages ativado!"
          else
            echo "Falha ao consultar Pages (HTTP $CODE)."
            exit 1
          fi
      - name: Utilizar arquivos web versionados
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/online.js
          test -f web/server-config.js
          test -f web/v77.js
          test -f web/judgment_arena.js
          test -f web/arena-demo.html
          echo "Publicando a mesma versão do código web revisado."
      - name: Testes automáticos do site
        run: |
          set -euo pipefail
          for f in web/*.js; do node --check "$f"; done
          node v7_pending/tests/web_auth_smoke.cjs
          node v7_pending/tests/word_bank_smoke.cjs
          node v7_pending/tests/v743_banner_assets_smoke.cjs
          V745_REQUIRE_ASSETS=1 node v7_pending/tests/v745_banners_integrity_smoke.cjs
          node v7_pending/tests/v75_smoke.cjs
          node v7_pending/tests/v75_ui_integration_smoke.cjs
          node v7_pending/tests/v76_entrance_smoke.cjs
          node v7_pending/tests/v762_room_controls_smoke.cjs
          node v7_pending/tests/v77_integration_smoke.cjs
          node v7_pending/tests/v77_android_race_smoke.cjs
          node v7_pending/tests/v77_android_browser_smoke.cjs
          node v7_pending/tests/v78_vote_replay_smoke.cjs
          node v7_pending/tests/v79_arena_frontal_smoke.cjs
          node v7_pending/tests/v81_arena_crown_rules_smoke.cjs
          node v7_pending/tests/v81_scoring_sql_smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          assert 'MIN=3' in Path('web/online.js').read_text()
          assert 'joined.length>=3' in Path('web/online.js').read_text()
          assert Path('web/words.js').read_text().count('"w":')==1348
          assert 'ES_SERVER_CONFIG' in Path('web/server-config.js').read_text()
          assert 'verifyEmailLink' in Path('web/online.js').read_text()
          print('Verificações de site, multiplayer e dicionário aprovadas.')
          PY
      - name: Empacotar site para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://kayssoneduardo.github.io/Kayssoneduardo-entre-suspeitos/
    steps:
      - name: Publicar na internet
        uses: actions/deploy-pages@v4

  verificar-site-publico:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar site real no iPhone e computador
        run: |
          set -euo pipefail
          URL="https://kayssoneduardo.github.io/Kayssoneduardo-entre-suspeitos"
          echo "Verificando $URL"
          for i in $(seq 1 12); do
            if curl --silent --show-error --fail --location --max-time 20 \
              -D /tmp/header -o /tmp/index "$URL/" \
              && grep -qi '^content-type: *text/html' /tmp/header \
              && grep -q 'ENTRE SUSPEITOS' /tmp/index; then
              break
            fi
            sleep 5
          done
          grep -qi '^content-type: *text/html' /tmp/header
          grep -q 'ENTRE SUSPEITOS' /tmp/index
          for file in online.js app.js server-config.js words.js cosmetics.js motion.js entrance.js v77.js judgment_arena.js vote_replay.js style.css arena-demo.html; do
            curl --silent --show-error --fail --location --retry 3 \
              --max-time 25 "$URL/$file" -o "/tmp/$file"
          done
          node --check /tmp/online.js
          node --check /tmp/app.js
          grep -q 'MIN=3' /tmp/online.js
          test "$(grep -o '"w":' /tmp/words.js | wc -l)" -eq 1348
          grep -q 'VERSÃO WEB 7.9.0' /tmp/index
          grep -q 'ARENA DO JULGAMENTO' /tmp/index
          grep -q 'v790-arena-frontal-20261117-r1' /tmp/index
          grep -q 'ESJudgmentArena' /tmp/judgment_arena.js
          grep -q 'ESJudgmentArena' /tmp/arena-demo.html
          grep -q '7.9' /tmp/arena-demo.html
          grep -q 'ESEntrance' /tmp/entrance.js
          grep -q 'ESV77' /tmp/v77.js
          grep -q 'es77-vote-choice' /tmp/online.js
          grep -q 'es_v77_season_ranking' /tmp/online.js
          grep -q 'es_v77_weekly_claim' /tmp/online.js
          grep -q 'es77-ready-summary' /tmp/style.css
          ! grep -q 'esEntryLegend' /tmp/online.js
          ! grep -q 'esDemoRole' /tmp/online.js
          ! grep -q 'shareLinkOn' /tmp/online.js
          ! grep -q 'voiceOn' /tmp/online.js
          grep -q 'inviteFriends' /tmp/online.js
          grep -q 'copyCodeOn' /tmp/online.js
          grep -q 'es-entrance-legend-portal' /tmp/entrance.js
          grep -q 'esLegendShockwave' /tmp/style.css
          grep -q 'esEntranceFigure' /tmp/style.css
          ! grep -q 'motionDemo()' /tmp/online.js
          ! grep -q 'entranceDemo()' /tmp/online.js
          grep -q 'esV75AuraSpin' /tmp/style.css
          grep -q 'ESMotion' /tmp/motion.js
          grep -q 'v745-approved-cinematic-20261114-r1' /tmp/cosmetics.js
          for code in padrao ecos_da_nevoa trono_arcano cacada_sombria lua_partida conspiracao cidade_sem_rosto corredor_espectral floresta_rubra eclipse_violeta juramento_oculto ruinas_do_segredo reino_dos_suspeitos escuta_noturna segredo_carmesim vidro_estilhacado; do
            curl --silent --show-error --fail --location --retry 4 --retry-delay 3 --max-time 25 "$URL/assets/banners/$code.webp?v=v745-approved-cinematic-20261114-r1" -o "/tmp/banner-$code.webp"
            test "$(head -c 4 "/tmp/banner-$code.webp")" = "RIFF"
            test "$(dd if="/tmp/banner-$code.webp" bs=1 skip=8 count=4 status=none)" = "WEBP"
            cmp "web/assets/banners/$code.webp" "/tmp/banner-$code.webp"
          done
          for code in classica bronze ouro nevoa coroa_arcana lamina_eclipse cacador_ebano ordem_velada rubi_sombrio sentinela_lunar espiral_abissal espectro_violeta chamas_eternas aurora_fantasma guardiao_do_eco trono_da_noite; do
            curl --silent --show-error --fail --location --retry 4 --retry-delay 3 --max-time 25 "$URL/assets/frames/$code.webp?v=v745-approved-cinematic-20261114-r1" -o "/tmp/frame-$code.webp"
            test "$(head -c 4 "/tmp/frame-$code.webp")" = "RIFF"
            test "$(dd if="/tmp/frame-$code.webp" bs=1 skip=8 count=4 status=none)" = "WEBP"
            cmp "web/assets/frames/$code.webp" "/tmp/frame-$code.webp"
          done
          echo "SITE PUBLICADO E VERIFICADO: $URL/ (16 banners e 16 molduras)"
