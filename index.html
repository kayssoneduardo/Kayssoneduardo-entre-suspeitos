<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d12"><title>Entre Suspeitos — Offline</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f3f4;background:#0d0d12;--accent:#ef454e;--panel:#1b1a23;--muted:#aaa6b1}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -15%,#471e2b 0,transparent 48%),#0d0d12}body.night{--accent:#9b75f5;background:radial-gradient(circle at 50% -15%,#252052 0,transparent 48%),#0d0d19}.wrap{max-width:540px;margin:auto;padding:22px 18px 48px}.brand{text-align:center;padding:20px 0 12px}.logo{font-size:46px;filter:drop-shadow(0 0 18px #b3273988)}h1{font-size:30px;letter-spacing:1px;margin:0}h2{font-size:22px;margin:0 0 12px}p{color:var(--muted);line-height:1.5}.sub{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:700}.panel{background:var(--panel);border:1px solid #ffffff18;border-radius:20px;padding:19px;margin:14px 0;box-shadow:0 10px 25px #0003}.field{margin:16px 0}label{display:block;font-size:14px;color:#e6dfe4;font-weight:650;margin-bottom:8px}input,select{box-sizing:border-box;width:100%;border:1px solid #ffffff30;background:#111117;color:white;border-radius:12px;padding:13px;font-size:16px}input[type=checkbox]{width:auto;accent-color:var(--accent)}.check{display:flex;gap:9px;align-items:center;background:#121118;border-radius:11px;padding:10px;margin:6px 0}.check label{margin:0;font-weight:500;flex:1}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.btn{background:var(--accent);color:white;border:0;border-radius:13px;padding:15px 17px;font-size:16px;font-weight:750;cursor:pointer;width:100%;margin-top:10px}.btn.secondary{background:#34313d}.btn.ghost{background:transparent;border:1px solid #ffffff35}.btn:disabled{opacity:.4}.small{font-size:13px}.error{color:#ff9b9b}.tag{display:inline-block;border:1px solid #ffffff28;padding:6px 11px;border-radius:50px;font-size:13px;color:#cfcbd4}.center{text-align:center}.secret{border:1px solid #ffffff2c;background:#111017;border-radius:18px;padding:28px 14px;margin:18px 0;min-height:160px;display:flex;flex-direction:column;justify-content:center}.word{font-size:32px;font-weight:850;overflow-wrap:anywhere}.danger{color:#ff686f}.hidden{display:none!important}.player{display:flex;align-items:center;gap:9px;margin:8px 0}.player input{flex:1}.number{width:28px;flex:0 0 28px;text-align:center;color:var(--accent);font-weight:800}.footer{color:#77717d;font-size:12px;text-align:center;margin-top:24px}.summary{background:#111017;border-radius:12px;padding:12px;margin:8px 0}.topbar{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--muted)}
</style></head><body><div class="wrap"><div class="brand"><div class="logo">◈</div><div class="sub">O segredo está entre nós</div><h1>ENTRE SUSPEITOS</h1><p class="small">Versão de testes • Modo offline</p></div><main id="app"></main><div class="footer">Um celular • Sem cadastro • Sem internet após abrir</div></div><script>
const BANK={
'Animais':[['Capivara','rio'],['Girafa','altura'],['Tubarão','oceano'],['Coruja','noite'],['Camaleão','mudança'],['Pinguim','frio'],['Elefante','memória'],['Jacaré','pântano'],['Golfinho','inteligência'],['Formiga','colônia']],
'Comidas':[['Lasanha','camadas'],['Pipoca','cinema'],['Feijoada','sábado'],['Açaí','tigela'],['Sushi','oriente'],['Cuscuz','café'],['Brigadeiro','festa'],['Pizza','fatias'],['Tapioca','frigideira'],['Hambúrguer','lanche']],
'Objetos':[['Guarda-chuva','chuva'],['Relógio','pontualidade'],['Espelho','reflexo'],['Tesoura','corte'],['Lanterna','escuridão'],['Mochila','viagem'],['Chave','acesso'],['Ventilador','calor'],['Bússola','direção'],['Travesseiro','descanso']],
'Lugares':[['Biblioteca','silêncio'],['Aeroporto','partida'],['Deserto','aridez'],['Cachoeira','queda'],['Hospital','cuidado'],['Castelo','realeza'],['Museu','história'],['Praia','areia'],['Estádio','torcida'],['Floresta','natureza']],
'Profissões':[['Bombeiro','emergência'],['Arquiteto','projeto'],['Veterinário','cuidado'],['Astronauta','espaço'],['Juiz','decisão'],['Padeiro','madrugada'],['Mecânico','motor'],['Professor','aprendizado'],['Fotógrafo','registro'],['Piloto','viagem']],
'Animes':[['Naruto','ninja'],['One Piece','piratas'],['Dragon Ball','energia'],['Death Note','caderno'],['Attack on Titan','muralhas'],['Demon Slayer','espadas'],['Pokémon','criaturas'],['Bleach','espíritos']],
'Personagens de animes':[['Luffy','chapéu'],['Goku','treinamento'],['Naruto Uzumaki','aldeia'],['Levi Ackerman','disciplina'],['Sasuke Uchiha','rivalidade'],['Light Yagami','justiça'],['Tanjiro Kamado','família'],['Pikachu','eletricidade']],
'Filmes':[['Titanic','oceano'],['Avatar','planeta'],['Jurassic Park','parque'],['Interestelar','tempo'],['Vingadores','equipe'],['O Rei Leão','savana'],['Harry Potter','magia'],['Matrix','realidade']],
'Personagens de filmes':[['Homem-Aranha','teia'],['Darth Vader','máscara'],['Jack Sparrow','pirata'],['Batman','noite'],['Hermione Granger','estudos'],['Indiana Jones','aventura'],['Shrek','pântano'],['Forrest Gump','corrida']],
'Personagens históricos':[['Cleópatra','Egito'],['Napoleão Bonaparte','império'],['Albert Einstein','ciência'],['Joana d’Arc','França'],['Dom Pedro II','monarquia'],['Leonardo da Vinci','renascimento'],['Santos Dumont','aviação'],['Marie Curie','pesquisa']],
'Marcas':[['Nike','esporte'],['Samsung','eletrônicos'],['Ferrari','velocidade'],['Adidas','listras'],['Coca-Cola','refrigerante'],['Apple','tecnologia'],['Lego','montagem'],['Netflix','streaming']],
'Esportes':[['Futebol','gol'],['Basquete','cesta'],['Vôlei','rede'],['Tênis','raquete'],['Natação','piscina'],['Judô','tatame'],['Ciclismo','pedal'],['Surfe','onda']]
};
const app=document.getElementById('app');const keys=Object.keys(BANK);let cfg={names:['Jogador 1','Jogador 2','Jogador 3','Jogador 4'],impostors:1,categories:[...keys],clue:'both',know:false,theme:'shadow'};let game=null,used=new Set();try{let c=JSON.parse(localStorage.getItem('es_config'));if(c)cfg={...cfg,...c}}catch{};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('es_config',JSON.stringify(cfg))}function theme(){document.body.className=cfg.theme==='night'?'night':''}function maxImp(n){return Math.max(1,Math.floor((n-1)/2))}function renderSetup(){theme();app.innerHTML=`<section class="panel"><h2>Preparar partida</h2><p class="small">Configure a rodada. As palavras são sorteadas sem mostrar a você antecipadamente.</p><div class="field"><label>Quantidade de jogadores</label><div class="row"><button class="btn secondary" id="minus" type="button">−</button><input id="count" type="number" min="4" max="30" value="${cfg.names.length}" style="text-align:center"><button class="btn secondary" id="plus" type="button">+</button></div></div><div id="names"></div><div class="field"><label>Quantidade de impostores</label><select id="imps"></select></div><div class="field"><label>Informações para o impostor</label><select id="clue"><option value="both">Categoria e dica</option><option value="category">Somente categoria</option><option value="hint">Somente dica</option><option value="none">Nenhuma informação</option></select></div><div class="check"><input type="checkbox" id="know"><label for="know">Impostores sabem quem são os parceiros</label></div><div class="field"><label>Tema visual</label><select id="theme"><option value="shadow">Sombra • preto e vermelho</option><option value="night">Noturno • azul e roxo</option></select></div></section><section class="panel"><h2>Categorias</h2><p class="small">Selecione pelo menos uma categoria para o sorteio.</p><div id="cats"></div><div class="row"><button class="btn secondary" id="all">Marcar todas</button><button class="btn secondary" id="none">Limpar</button></div></section><p id="err" class="error small"></p><button class="btn" id="start">Sortear e começar</button>`;drawNames();drawImps();drawCats();document.getElementById('clue').value=cfg.clue;document.getElementById('know').checked=cfg.know;document.getElementById('theme').value=cfg.theme;document.getElementById('minus').onclick=()=>resize(cfg.names.length-1);document.getElementById('plus').onclick=()=>resize(cfg.names.length+1);document.getElementById('count').onchange=e=>resize(+e.target.value);document.getElementById('imps').onchange=e=>{cfg.impostors=+e.target.value;save()};document.getElementById('clue').onchange=e=>{cfg.clue=e.target.value;save()};document.getElementById('know').onchange=e=>{cfg.know=e.target.checked;save()};document.getElementById('theme').onchange=e=>{cfg.theme=e.target.value;theme();save()};document.getElementById('all').onclick=()=>{cfg.categories=[...keys];drawCats();save()};document.getElementById('none').onclick=()=>{cfg.categories=[];drawCats();save()};document.getElementById('start').onclick=startGame}
function drawNames(){document.getElementById('names').innerHTML='<label>Nomes dos jogadores (na ordem da roda)</label>'+cfg.names.map((n,i)=>`<div class="player"><span class="number">${i+1}</span><input data-player="${i}" maxlength="26" value="${esc(n)}" aria-label="Nome do jogador ${i+1}"></div>`).join('');document.querySelectorAll('[data-player]').forEach(el=>el.oninput=e=>{cfg.names[+e.target.dataset.player]=e.target.value;save()})}function drawImps(){let max=maxImp(cfg.names.length);cfg.impostors=Math.min(Math.max(1,cfg.impostors),max);document.getElementById('imps').innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}">${i+1} ${i?'impostores':'impostor'}</option>`).join('');document.getElementById('imps').value=cfg.impostors}function drawCats(){document.getElementById('cats').innerHTML=keys.map(k=>`<div class="check"><input type="checkbox" id="cat${keys.indexOf(k)}" data-cat="${esc(k)}" ${cfg.categories.includes(k)?'checked':''}><label for="cat${keys.indexOf(k)}">${esc(k)}</label></div>`).join('');document.querySelectorAll('[data-cat]').forEach(el=>el.onchange=e=>{let k=e.target.dataset.cat;cfg.categories=e.target.checked?[...cfg.categories,k]:cfg.categories.filter(x=>x!==k);save()})}function resize(n){n=Math.max(4,Math.min(30,Number.isFinite(n)?n:4));cfg.names=Array.from({length:n},(_,i)=>cfg.names[i]??`Jogador ${i+1}`);save();renderSetup()}
function randomInt(max){const a=new Uint32Array(1);let lim=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){const names=cfg.names.map(x=>x.trim());let err=document.getElementById('err');if(names.some(x=>!x)){err.textContent='Preencha o nome de todos os jogadores.';return}if(new Set(names.map(x=>x.toLowerCase())).size!==names.length){err.textContent='Use nomes diferentes para cada jogador.';return}if(!cfg.categories.length){err.textContent='Selecione pelo menos uma categoria.';return}let pool=cfg.categories.flatMap(c=>BANK[c].map(([w,h])=>({c,w,h})));let available=pool.filter(x=>!used.has(x.c+'|'+x.w));if(!available.length){used.clear();available=pool}let word=available[randomInt(available.length)];used.add(word.c+'|'+word.w);let imps=shuffle(Array.from({length:names.length},(_,i)=>i)).slice(0,cfg.impostors);game={names,word,imps,idx:0,shown:false};save();renderReveal()}
function renderReveal(){let i=game.idx;if(i>=game.names.length){renderDiscussion();return}let imp=game.imps.includes(i);app.innerHTML=`<div class="panel center"><span class="tag">Jogador ${i+1} de ${game.names.length}</span><h2 style="margin-top:20px">${esc(game.names[i])}</h2><p>Confira se o celular está só com você.</p><div class="secret" id="secret"><div class="logo">◈</div><p>Toque para revelar sua informação secreta.</p></div><button class="btn" id="reveal">Revelar meu papel</button><p class="small">Não deixe o próximo jogador ver sua tela.</p></div>`;document.getElementById('reveal').onclick=()=>{if(!game.shown){game.shown=true;let partners=game.imps.filter(x=>x!==i).map(x=>game.names[x]);let info=imp?`<div class="word danger">VOCÊ É IMPOSTOR</div>${['both','category'].includes(cfg.clue)?`<p><strong>Categoria:</strong> ${esc(game.word.c)}</p>`:''}${['both','hint'].includes(cfg.clue)?`<p><strong>Dica:</strong> ${esc(game.word.h)}</p>`:''}${cfg.know&&partners.length?`<p><strong>Outros impostores:</strong> ${esc(partners.join(', '))}</p>`:''}`:`<div class="sub">Sua palavra</div><div class="word">${esc(game.word.w)}</div><p>Categoria: ${esc(game.word.c)}</p>`;document.getElementById('secret').innerHTML=info;document.getElementById('reveal').textContent='Esconder e passar o celular'}else{game.idx++;game.shown=false;renderReveal()}}}
function renderDiscussion(){app.innerHTML=`<div class="panel center"><div class="logo">◈</div><h2>Hora das pistas!</h2><p>Todos já viram seus papéis. Comecem pela ordem em que estão sentados. Não há cronômetro no modo offline.</p><div class="summary"><strong>${game.names.length} jogadores</strong> · ${game.imps.length} ${game.imps.length===1?'impostor':'impostores'}<p class="small">A votação e a decisão são feitas verbalmente, entre vocês.</p></div><button class="btn" id="end">Revelar resultado</button><button class="btn ghost" id="reset">Nova rodada sem revelar</button></div>`;document.getElementById('end').onclick=renderResult;document.getElementById('reset').onclick=()=>{if(confirm('Descartar esta rodada e sortear outra palavra?'))startGame()}}
function renderResult(){app.innerHTML=`<div class="panel center"><div class="sub">Fim da rodada</div><h2>Os segredos foram revelados</h2><div class="secret"><div class="sub">Palavra secreta</div><div class="word">${esc(game.word.w)}</div><p>${esc(game.word.c)}</p></div><h2>Impostor${game.imps.length>1?'es':''}</h2>${game.imps.map(i=>`<div class="summary danger"><strong>${esc(game.names[i])}</strong></div>`).join('')}<button class="btn" id="again">Jogar novamente</button><button class="btn secondary" id="edit">Alterar configurações</button></div>`;document.getElementById('again').onclick=startGame;document.getElementById('edit').onclick=renderSetup}renderSetup();
</script></body></html>
